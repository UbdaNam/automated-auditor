[project]
name = "automated-auditor"
version = "0.1.0"
description = "Automated code repository auditor using LangGraph"
authors = [{name = "Abdurahim M.", email = "abdugreat3@gmail.com"}]
dependencies = [
    "langgraph>=0.0.28",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "pydantic>=2.0.0",
    "PyPDF2>=3.0.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]