[project]
name = "automated-auditor"
version = "0.1.0"
description = "Automated Audit Agent Swarm for Code Repository Analysis"
authors = [
    {name = "Abdurahim M.", email = "abdugreat3@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"

# Core dependencies only
dependencies = [
    "langgraph>=0.2.47",
    "langchain-openai>=0.2.14",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "docling>=1.3.0",  # Added docling
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "black>=24.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Simplified linting configuration
[tool.black]
target-version = ['py311']
line-length = 88
